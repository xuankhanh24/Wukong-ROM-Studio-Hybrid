<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="wukong-mini-api-endpoint" content="__WUKONG_TELEGRAM_MINI_APP_API_URL__" />
    <meta name="wukong-telegram-bot" content="WK_build_bot" />
    <meta name="wukong-ui-variant" content="joly" />
    <link rel="preload" href="/geist-sans-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/geist-mono-variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>Wukong ROM Studio</title>
    <script>
      (() => {
        const theme = localStorage.getItem("wukong-theme") || "system";
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.colorScheme = dark ? "dark" : "light";
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
