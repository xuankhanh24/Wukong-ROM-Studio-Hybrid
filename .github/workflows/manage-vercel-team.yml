name: Manage Vercel Team

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email to invite to Vercel team"
        required: true
        default: "luuxuankhanh2004@gmail.com"

permissions:
  contents: read

jobs:
  invite:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect Vercel user and teams, and invite member
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          INVITE_EMAIL: ${{ inputs.email }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== 1. Inspect Token Owner ==="
          user_info=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/user")
          echo "Logged in username: $(echo "$user_info" | jq -r '.user.username // "unknown"')"
          echo "Logged in email: $(echo "$user_info" | jq -r '.user.email // "unknown"')"

          echo "=== 2. Inspect Teams ==="
          teams_info=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/teams")
          echo "$teams_info" | jq -r '.teams[]? | "Team: \(.name) (\(.slug)), ID: \(.id)"'

          echo "=== 3. Invite Member to Team ==="
          team_id="${VERCEL_ORG_ID:-team_r1Xe5ozxPEWZcNvzj2mKFHiu}"
          invite_res=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v2/teams/${team_id}/members" \
            -d "[{\"email\":\"${INVITE_EMAIL}\",\"role\":\"MEMBER\"}]")
          echo "Invite response: $invite_res"

          echo "=== 4. Check Team Members ==="
          members_res=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/teams/${team_id}/members")
          echo "$members_res" | jq -r '.members[]? | "Member: \(.email // .username // .name // "n/a"), Role: \(.role)"'
